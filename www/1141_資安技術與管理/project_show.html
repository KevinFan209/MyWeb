<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<title>ECC 期末展示（ECIES + ECDSA + ECDH）</title>
<style>
body { font-family: Arial,"微軟正黑體"; padding:20px }
.threecol { display:flex; gap:20px }
.col { width:33%; border:1px solid #aaa; padding:10px; border-radius:8px }
.msgbox { position:absolute; background:#fff3b0; padding:6px 10px; border-radius:6px }
.move { animation: fly 1s linear forwards }
@keyframes fly { from{left:5%} to{left:65%} }
.result { white-space:pre-wrap; background:#f5f5f5; padding:8px }
</style>
</head>
<body>

<h2 align="center">ECC 期末展示：ECIES + ECDSA + ECDH</h2>

<div class="threecol" id="area">

<div class="col">
<h3>Alice</h3>
<textarea id="msg">你好 Bob</textarea><br>
<input type="file" id="img"><br><br>
<button onclick="send()">傳送</button>
</div>

<div class="col">
<h3>MITM</h3>
<div id="mitm" class="result">等待攔截</div>
</div>

<div class="col">
<h3>Bob</h3>
<div id="bob" class="result">等待中</div>
</div>

</div>

<script>
let aliceSignKey, bobECDH, aliceECDH;

(async()=>{
  aliceSignKey = await crypto.subtle.generateKey(
    {name:"ECDSA", namedCurve:"P-256"}, true, ["sign","verify"]
  );
  bobECDH = await crypto.subtle.generateKey(
    {name:"ECDH", namedCurve:"P-256"}, true, ["deriveKey"]
  );
})();

async function send(){
  const text = document.getElementById("msg").value;
  const file = document.getElementById("img").files[0];

  aliceECDH = await crypto.subtle.generateKey(
    {name:"ECDH", namedCurve:"P-256"}, true, ["deriveKey"]
  );

  const sig = await crypto.subtle.sign(
    {name:"ECDSA", hash:"SHA-256"},
    aliceSignKey.privateKey,
    await crypto.subtle.exportKey("raw", aliceECDH.publicKey)
  );

  document.getElementById("mitm").textContent =
    "攔截到暫時公鑰\nECDSA 簽章(Base64):\n" +
    btoa(String.fromCharCode(...new Uint8Array(sig)));

  const valid = await crypto.subtle.verify(
    {name:"ECDSA", hash:"SHA-256"},
    aliceSignKey.publicKey,
    sig,
    await crypto.subtle.exportKey("raw", aliceECDH.publicKey)
  );

  if(!valid){
    document.getElementById("bob").textContent="❌ 簽章驗證失敗";
    return;
  }

  const aesKey = await crypto.subtle.deriveKey(
    {name:"ECDH", public:aliceECDH.publicKey},
    bobECDH.privateKey,
    {name:"AES-GCM", length:256},
    true,
    ["encrypt","decrypt"]
  );

  let data;
  if(file){
    data = await file.arrayBuffer();
  }else{
    data = new TextEncoder().encode(text);
  }

  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM",iv}, aesKey, data);

  const decrypted = await crypto.subtle.decrypt({name:"AES-GCM",iv}, aesKey, ct);

  if(file){
    const url = URL.createObjectURL(new Blob([decrypted]));
    document.getElementById("bob").innerHTML =
      "✅ 圖片解密成功<br><img src='"+url+"' width='200'>";
  }else{
    document.getElementById("bob").textContent =
      "✅ 解密成功：\n" + new TextDecoder().decode(decrypted);
  }
}
</script>
</body>
</html>
